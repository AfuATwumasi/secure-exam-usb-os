<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KNUST Secure Exam OS Admin Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="login-card">

        <div class="header">
            <img src="../images/knustlogo.png" alt="KNUST Logo">
            <h2>KNUST ISO BUILDER</h2>
        </div>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Log in
            </button>

        </form>

        <p class="forgot-password">Administrator access only.</p>

    </div>

    <script src="../js/login.js"></script>

</body>
</html>
