<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exam Portal</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="container">
    <div class="card">

      <div class="icon">
  <img src="/images/knustlogo.png" alt="Knust logo">
</div>

      <h2>Exam Portal</h2>
      <p>Sign in to your account</p>

      <!-- Role Switch -->
      <div class="roles">
        <button class="role active" data-role="student">Student</button>
        <button class="role" data-role="teacher">Teacher</button>
        <button class="role" data-role="admin">Admin</button>
      </div>

      <!-- Form -->
      <form id="loginForm">
        <input type="email" id="email" placeholder="Enter your email" required />
        <input type="password" id="password" placeholder="Enter your password" required />

        <button type="submit" id="submitBtn">Sign In as Student</button>
      </form>

    

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
